<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008F87"/>
      <stop offset="100%" stop-color="#005854"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Left Medical Stethoscope Crescent Emblem -->
  <g transform="translate(10, 10)">
    <!-- Cyan / Teal swoosh -->
    <path d="M 45 10 C 20 10, 8 28, 12 50 C 15 65, 28 72, 38 74 C 26 72, 18 62, 18 48 C 18 28, 32 18, 48 18 C 58 18, 62 25, 60 35 C 57 50, 42 62, 32 75 C 25 84, 25 90, 32 90 C 40 90, 52 75, 58 65 C 64 55, 68 40, 68 28 C 68 15, 58 10, 45 10 Z" fill="#008F87"/>
    <!-- Red Accent Heart / Pulse -->
    <path d="M 38 42 C 34 35, 25 35, 22 42 C 18 50, 25 60, 34 68 C 43 60, 50 50, 46 42 C 43 35, 34 35, 38 42 Z" fill="#EF4444"/>
    <circle cx="34" cy="52" r="9" fill="#FFFFFF"/>
    <text x="34" y="55" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7" font-weight="900" fill="#EF4444" text-anchor="middle">24</text>
    <text x="34" y="60" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="4" font-weight="700" fill="#EF4444" text-anchor="middle">JAM</text>
    <!-- Stethoscope Pulse line -->
    <path d="M 48 55 L 56 55 L 60 42 L 65 68 L 70 50 L 74 58 L 80 55 L 90 55" fill="none" stroke="#00A896" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Clinic Text -->
  <g transform="translate(98, 38)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" fill="#173D3B" letter-spacing="-0.5">POLIKLINIK</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="900" fill="#006C67" letter-spacing="-0.5">AL-FARHAIN <tspan fill="#EF4444">24 JAM</tspan></text>
    <text x="0" y="40" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="700" fill="#526966" letter-spacing="1.2">FAMILY MEDICAL CARE CLINIC</text>
  </g>

  <!-- Right Red Round Badge: 24 JAM DIBUKA SETIAP HARI -->
  <g transform="translate(390, 52)">
    <circle cx="0" cy="0" r="38" fill="#B91C1C"/>
    <circle cx="0" cy="0" r="34" fill="#DC2626" stroke="#FFFFFF" stroke-width="2"/>
    <text x="0" y="-8" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">24</text>
    <text x="18" y="-12" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF">JAM</text>
    <rect x="-30" y="2" width="60" height="15" rx="3" fill="#FFFFFF"/>
    <text x="0" y="10" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6.5" font-weight="900" fill="#DC2626" text-anchor="middle">DIBUKA</text>
    <text x="0" y="15" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="5" font-weight="800" fill="#DC2626" text-anchor="middle">SETIAP HARI</text>
  </g>
</svg>
